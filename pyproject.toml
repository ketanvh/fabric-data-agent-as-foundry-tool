[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-fabric-demo"
version = "0.1.0"
description = "Demo of a Microsoft Foundry prompt agent calling a Fabric data agent"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.24.0",
    "httpx>=0.28.0",
    "mcp>=1.13.0",
    "openai>=1.99.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]

[project.scripts]
foundry-fabric-demo = "foundry_fabric_demo.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]